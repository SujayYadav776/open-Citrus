name: Tests

on:
  push:
    # `main` is a stale copy of upstream; the active branch is `windows-port`.
    # Both are listed so a merge to either still runs the suite.
    branches: [main, windows-port]
  pull_request:
  # Lets a maintainer run the suite on demand from the Actions tab.
  workflow_dispatch:

jobs:
  cargo-test:
    strategy:
      # A Windows failure must not cancel the Linux run and the other way round: they are
      # independent evidence about two different platforms.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri needs the WebKit/GTK stack on Linux only. The conversion tools are optional
      # everywhere, since the integration tests skip themselves when a tool is missing, so
      # the Windows job still compiles the crate and runs the pure logic, the catalog
      # scanner, and the Job Object test that does not exist on Linux at all.
      - name: Install system libraries and conversion tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev \
            ffmpeg imagemagick librsvg2-bin pandoc poppler-utils ghostscript zip unzip p7zip-full \
            libreoffice-writer libreoffice-calc libreoffice-impress

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        working-directory: src-tauri
        shell: bash
        run: cargo test

      # The catalog test reads the source as text and cuts it at the test module, so it
      # depends on the checkout having LF endings. That is .gitattributes' job; this prints
      # what was really checked out, so that if the guarantee ever goes missing the log says
      # so instead of failing with a message about a missing Portuguese translation.
      - name: Show the line endings actually checked out
        if: always()
        shell: bash
        run: git ls-files --eol src-tauri/src/lang.rs src-tauri/src/converters.rs
